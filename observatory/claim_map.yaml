# Hand-authored claim map: Curved Number Line / book claim IDs → Lean declarations.
# The *register* for each linked declaration is DERIVED from registry/theorems.json
# by scripts/gen_claims.py — never hand-painted here.
#
# Fields:
#   id:            stable public claim ID (book margin / Observatory primary key)
#   title:         short human title
#   book:          where it appears (volume / section)
#   lean:          list of fully-qualified Brockian.* declaration names (may be empty)
#   badge_force:   optional override when there is no Lean yet:
#                    not_claimed | prose | empirical | open | aristotle
#   notes:         honesty / scope (never used to upgrade a register)

version: 1
program: Brockian Mathematics / Riemann Labs
charter: |
  Badges are derived from the Lean registry when `lean` is non-empty.
  PROVED requires AXLE-verified + axiom-clean theorems (see README).
  Open problems (twins infinitude, Goldbach global, RH) stay not_claimed.

