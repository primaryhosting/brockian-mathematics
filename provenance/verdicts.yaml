    provenance_note: "HARMONIC-PROVED Wilson's theorem as a full iff (Aristotle/Harmonic, AXLE-verified @4.32, axiom-clean). prime_iff_dvd_factorial_succ: for n>=2, n is prime IFF n | (n-1)!+1. The complete Wilson characterization at the Nat level."

  "korselt-carmichael":
    module: Brockian.KorseltCarmichael
    verdict: admit
    quarantine: true
    ledger_run: "Harmonic/Aristotle 1772947a; AXLE @4.32"
    provenance_note: "HARMONIC-PROVED hard theorem: Korselt's criterion (hard direction), independently AXLE-verified @4.32, axiom-clean. korselt_carmichael: a squarefree composite n with (p-1)|(n-1) for every prime p|n is a Fermat pseudoprime to every base coprime to n (a^n = a mod n) -- i.e. a Carmichael number. Needs Fermat's little theorem for all bases; a genuine analysis-grade result the decide-swarm could not do. Complements the concrete Brockian.CarmichaelKorselt module with the general Korselt=>Carmichael direction."

  "odd-perfect-mod4":
