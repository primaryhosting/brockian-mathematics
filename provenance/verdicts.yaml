    provenance_note: "HARMONIC-PROVED general theorem: Mersenne exponent primality (Aristotle/Harmonic proof run 9e257cf6, independently AXLE-verified @lean-4.32.0, axiom-clean). mersenne_exponent_prime: if 2^n - 1 is prime then n is prime -- the classical exponent constraint on Mersenne primes (rules out n=1, then a^n-1 factorization). Complements the Brockian.MersennePerfect concrete module with the general structural direction."

  "wilson-general":
