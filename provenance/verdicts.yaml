# Hand-authored provenance + verdicts map (spec §3.2 / §5).
# Two levels: run-level defaults (apply to every keeper from that run) and
# per-declaration overrides for SPLIT runs. Every `exclude` must cite a ledger line.
#
# Registers are DERIVED by gen_registry.py from build facts + AXLE verdict + rung;
# this file supplies only what the compiled environment cannot: provenance + verdicts.

# Modules that are "fully closed": sorry/admit is BLOCKING there (spec §4).
closed_modules:
  - Core
  - Admissibility
  - TransitionKernel

runs:
  # ── run 74 / 119-module-2: the q−ν admissibility law ────────────────────────
  "74":
    module: Brockian.Admissibility
    verdict: admit
    quarantine: true
    ledger_run: "74 (a0ce…) / 49 / 105 (independent replications) / 119 module 2"
    provenance_note: "citation-grade ZMod q−ν law; q=3→1 (twin), q=5→3 (Brockian)"

  # ── intake 18 run cabbba6e: the Goldbach comb ───────────────────────────────
  "GC":
    module: Brockian.GoldbachComb
    verdict: admit
    quarantine: true
    ledger_run: "intake 18 (cabbba6e) — GC-1/2/3 KEEPER, exemplary"
    provenance_note: "exact local covariance kernel; GC-4 rejected/omitted, GC-5 open (both excluded)"
    overrides:
      # GC-4 and GC-5 were shipped as comments in the source, never as theorems — nothing to exclude
      # at declaration level; the transfer conjecture is a def (CONJECTURE), not a claim.
      - name: GoldbachCovarianceTransfer
        verdict: admit
        conditional_rung: null
        provenance_note: "named transfer conjecture (Prop container) — CONJECTURE register, never claimed"

  # ── intake run 63 (a0ce…): Hardy–Littlewood singular series for the q−ν law ──
  "63":
    module: Brockian.SingularSeries
    verdict: admit
    quarantine: true
    ledger_run: "intake run 63 (a0ce…) — largest clean analytic run; singular series"
    provenance_note: "local-factor positivity + summability; feeds the q−ν law's analytic side"
    overrides:
      - name: singular_series_pos
        verdict: admit
        conditional_rung: classical
        provenance_note: "conditional on convergence-to-positive-limit (classical analytic fact, stated as explicit hypothesis h_conv, not axiomatized)"

  # ── run 97 / 103 / 112: φ-algebra, ray ring, Dirichlet-on-rays ───────────────
  "97":
    module: Brockian.Core
    verdict: admit
    quarantine: true
    ledger_run: "runs 97 / 103 / 112 (consolidation anchors) — φ stack, ray ring, Dirichlet-on-rays"
    provenance_note: "φ²=φ+1, cos π/5=φ/2, Binet, ray ring homs, each active ray has ∞ primes (Dirichlet)"

  # ── runs 16 / 54 / 70 / 73: pentagon geometry + C₅ spectrum ──────────────────
  "geom":
    module: Brockian.Geometry
    verdict: admit
    quarantine: true
    ledger_run: "runs 16 / 54 / 70 / 73 — pentagon golden diagonal, two-distance, C₅ spectrum"
    provenance_note: "golden diagonal=φ·side, two-distance, −φ∈spec(C₅); golden_unique_to_five NOT ported (see PORT-QUEUE)"

  # ── runs 7 / 31 / 117: transition kernel + constellation classification ──────
  "kernel":
    module: Brockian.TransitionKernel
    verdict: admit
    quarantine: true
    ledger_run: "runs 7 / 31 / 117 — kernel double-count, constellation classification, twin exclusion"
    provenance_note: "totalSum_eq double-count, twin/cousin/sexy/quadruplet tables via kernel decide"

  # ── run 73: golden_unique_to_five (re-proved fresh, full biconditional) ──────
  "73":
    module: Brockian.Spectral
    verdict: admit
    quarantine: true
    ledger_run: "run 73 (b666…) — re-proved fresh @ v4.32 via concrete circulant eigenvalues"
    provenance_note: "φ−1 ∈ spec(C_p) ⟺ p=5 (full iff, both directions); −φ ∈ spec(C₅). THE 'why five' rigidity result."

  # ── run 88: pentagon algebraic connectivity λ₂(C₅)=2−1/φ (re-proved fresh) ────
  "88":
    module: Brockian.Connectivity
    verdict: admit
    quarantine: true
    ledger_run: "run 88 (1d2a…) — re-proved fresh @ v4.32 via concrete Laplacian eigenvalues"
    provenance_note: "λ₂(C₅) = 2 − 1/φ = 3 − φ (algebraic connectivity is golden); ratio 1 − 1/(2φ)"

  # ── intake 18: silver eigensystem, twin pinning, phase-depth torus ───────────
  "18":
    module: Brockian.Sieve
    verdict: admit
    quarantine: true
    ledger_run: "intake 18 (dd6a6bd3 / bdfa6014) — silver eigensystem, no-go, run-cap, torus"
