    verdict: admit
    quarantine: true
    ledger_run: "open-territory swarm; AXLE @4.32"
    provenance_note: "OPEN-TERRITORY partial results toward the Erdos-Straus conjecture (open since 1948; 4/n = 1/x+1/y+1/z in positive integers). Swarm-built, AXLE @4.32, axiom-clean. UNCONDITIONALLY PROVED: the even case, the divisible-by-3 case, the multiplicativity reduction erdosStraus_of_dvd (inherited by multiples), erdosStraus_of_prime_case (the whole conjecture REDUCES TO PRIMES), and residue classes n=3 mod 4 and n=2 mod 3, via explicit verified Egyptian-fraction identities. The full conjecture ErdosStrausConjecture is a DEFINITION (unproven statement), NOT a theorem -- deliberately. Open frontier: primes in the hard residues p = 1,121,169,289,361,529 mod 840. This is an honest formalized contribution to an open problem, resolving all but a density-zero set of n; it does NOT claim to solve the conjecture."

  "erdos-straus-residues":
