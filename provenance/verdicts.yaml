    verdict: admit
    quarantine: true
    ledger_run: "open-territory loop; AXLE @4.32"
    provenance_note: "OPEN-TERRITORY superperfect numbers (open-territory loop, AXLE @4.32, axiom-clean). Superperfect n := sigma(sigma(n))=2n. CONCRETE: superperfect_{2,4,16,64}. FLAGSHIP superperfect_two_pow_of_mersenne_prime: 2^(p-1) is superperfect when 2^p-1 is a Mersenne prime (sigma(2^(p-1))=2^p-1=mersenne p, then sigma(mersenne p)=1+mersenne p=2^p=2*2^(p-1)) -- ties superperfect to Mersenne primes. Non-example six_not_superperfect. The OPEN question -- does an ODD superperfect number exist? (none known, parallel to odd perfect/odd Giuga/odd weird) -- is an unproven def OddSuperperfectExists, never asserted or denied."

  "hyperperfect-numbers":
    module: Brockian.HyperperfectNumbers
    verdict: admit
    quarantine: true
    ledger_run: "open-territory loop; AXLE @4.32"
    provenance_note: "OPEN-TERRITORY hyperperfect numbers (open-territory loop, AXLE @4.32, axiom-clean). Hyperperfect k n := k*sigma(n) = (k+1)*n + (k-1); k=1 recovers perfect numbers. CONCRETE: hyperperfect_1_{6,28} (perfect), hyperperfect_2_{21,2133}, hyperperfect_6_301. FLAGSHIP hyperperfect_one_iff_sigma_two_mul: 1-hyperperfect <=> sigma(n)=2n (perfect) -- hyperperfect generalizes perfect. Non-example not_hyperperfect_2_6. HyperperfectAllK (k-hyperperfect exists for every k) and HyperperfectInfinitude are unproven defs -- OPEN, never asserted."

  "unitary-perfect":
    module: Brockian.UnitaryPerfect
    verdict: admit
    quarantine: true
    ledger_run: "open-territory loop; AXLE @4.32"
    provenance_note: "OPEN-TERRITORY unitary perfect numbers (open-territory loop, AXLE @4.32, axiom-clean). unitaryDivisorSum = sum of unitary divisors (d|n with gcd(d,n/d)=1); UnitaryPerfect n := sigma*(n)=2n. CONCRETE: unitaryPerfect_{6,60,90} (three of the five known). Non-example not_unitaryPerfect_28 (perfect but not unitary-perfect: sigma*(28)=40 != 56); contrast unitaryDivisorSum_eq_sigma_6 (sigma*=sigma for squarefree 6). Only FIVE unitary perfect numbers are known; SixthUnitaryPerfectExists (does a 6th exist beyond 87360?) is an unproven def -- OPEN, never asserted or denied."

  "betrothed-numbers":
    module: Brockian.BetrothedNumbers
    verdict: admit
    quarantine: true
    ledger_run: "open-territory loop; AXLE @4.32"
    provenance_note: "OPEN-TERRITORY betrothed (quasi-amicable) numbers (open-territory loop, AXLE @4.32, axiom-clean). Betrothed m n := s(m)=n+1 and s(n)=m+1 (s = aliquot sum), the off-by-one cousin of amicable pairs. CONCRETE: betrothed_{48_75,140_195,1050_1925}; structural betrothed_symm/betrothed_ne; opposite-parity illustrations. BetrothedInfinitude (infinitely many pairs) and SameParityBetrothedExists (does a same-parity pair exist? all known are opposite-parity) are unproven defs -- OPEN, never asserted."

  "ruth-aaron-pairs":
    module: Brockian.RuthAaronPairs
    verdict: admit
    quarantine: true
    ledger_run: "open-territory loop; AXLE @4.32"
    provenance_note: "OPEN-TERRITORY Ruth-Aaron pairs (open-territory loop, AXLE @4.32, axiom-clean). sopfr = sum of prime factors with multiplicity (Nat.primeFactorsList.sum); RuthAaron n := sopfr n = sopfr (n+1). CONCRETE: ruthAaron_{5,77,125,714} incl the namesake 714/715 (both sopfr=29, Babe Ruth / Hank Aaron). Since Nat.primeFactorsList is well-founded (does NOT reduce under decide), values proved via factorization uniqueness (helper sopfr_eq + Nat.primeFactorsList_unique + List.Perm.sum_eq) -- NOT native_decide. Non-example not_ruthAaron_6. RuthAaronInfinitude (infinitely many pairs) is an unproven def -- OPEN, never asserted."

  "ore-harmonic-numbers":
    module: Brockian.OreHarmonicNumbers
    verdict: admit
    quarantine: true
    ledger_run: "open-territory loop; AXLE @4.32"
    provenance_note: "OPEN-TERRITORY Ore harmonic divisor numbers (open-territory loop, AXLE @4.32, axiom-clean). Harmonic n := sigma(n) | n*tau(n) (harmonic mean of divisors is integer). CONCRETE: harmonic_{6,28,140,270,496}; non-example not_harmonic_4. Every perfect number is harmonic; Ore's conjecture (no odd harmonic number > 1) would IMPLY no odd perfect number -- the OPEN question OddHarmonicExists (does an odd harmonic divisor number > 1 exist?) is an unproven def, never asserted or denied. Connects to the odd-perfect cluster."

  "odd-perfect-euler":
    module: Brockian.OddPerfectEuler
    verdict: admit
    quarantine: true
    ledger_run: "Harmonic/Aristotle proof 0f4ddfbb; AXLE @4.32"
    provenance_note: "HARMONIC-PROVED hard theorem: Euler's form for odd perfect numbers (Aristotle/Harmonic proof run 0f4ddfbb, independently AXLE-verified @lean-4.32.0, axiom-clean). oddPerfect_euler_form: if n is odd and perfect then n = p^k * m^2 with p prime, p=1 mod 4, k=1 mod 4, and p not dividing m -- Euler's classical theorem on the structure of any (hypothetical) odd perfect number. Proof via the divisor-sum factorization mod 4 (unique exceptional prime/exponent, all other exponents even, reconstruct the square factor). This is the genuinely HARD partial result my decide-swarm dropped twice, landed by Harmonic's stronger compute and verified on our own toolchain. Odd perfect existence itself remains OPEN."

  "practical-numbers":
    module: Brockian.PracticalNumbers
    verdict: admit
    quarantine: true
    ledger_run: "open-territory loop; AXLE @4.32"
    provenance_note: "OPEN-TERRITORY practical numbers (open-territory loop, AXLE @4.32, axiom-clean). Practical n := every m<=n is a subset-sum of the divisors of n. FLAGSHIP GENERAL THEOREM practical_pow_two: EVERY power of 2 is practical -- real induction on k (binary representation), not a table lookup. CONCRETE: practical_{6,12,20,28}; non-example not_practical_10. PracticalTwinInfinitude (Margenstern-type: infinitely many p with p,p+2 both practical) is an unproven def -- OPEN, never asserted."

  "mersenne-exponent-prime":
    module: Brockian.MersenneExponentPrime
    verdict: admit
    quarantine: true
