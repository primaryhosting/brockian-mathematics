    verdict: admit
    quarantine: true
    ledger_run: "Harmonic/Aristotle 73e0a459; AXLE @4.32"
    provenance_note: "HARMONIC-PROVED: an odd perfect number is 1 mod 4 (Aristotle/Harmonic, AXLE-verified @4.32, axiom-clean). oddPerfect_mod4: Odd n and Perfect n imply n%4=1 -- a necessary condition on any hypothetical odd perfect number (a corollary-strength consequence of Euler's form). Odd perfect existence remains OPEN."

  "erdos-320-lemmas":
    module: Brockian.Erdos320
    verdict: admit
    quarantine: true
    ledger_run: "frontier swarm; AXLE @4.32"
    provenance_note: "SWARM-PROVED: the one unconditional analytic step of Erdos Problem #320 ('A Spectral Completion', C. Brock). For 0<=t<=1/2, 0 <= -log(1-t) <= t/(1-t) <= 2t -- the load-bearing inequality chain that turns per-step deficits into the loss exponent L(N) with 0<=L(N)<=2E(N). Everything downstream in the paper is CONDITIONAL on named conjectures; this chain is the piece that must hold unconditionally, so it is exactly what is verified. Erdos #320 itself remains OPEN."

  "zumkeller-numbers":
    module: Brockian.ZumkellerNumbers
    verdict: admit
    quarantine: true
    ledger_run: "frontier swarm; AXLE @4.32"
    provenance_note: "SWARM-PROVED Zumkeller numbers with GENERAL structural theorems (AXLE @4.32, axiom-clean). A number is Zumkeller if its divisors split into two equal-sum sets (half-sum characterization exists S subset divisors, 2*sum S = sigma). GENERAL: zumkeller_sigma_even (sigma is even); zumkeller_two_mul_le_sigma (flagship -- every positive Zumkeller number is perfect-or-abundant, 2n <= sigma(n)); not_zumkeller_prime (no prime is Zumkeller, via deficiency). Concrete witnesses 6,12,20,24,28,30 with explicit half-sets. OddZumkellerFrom3Structure is an unproven OPEN def (odd Zumkeller structure; smallest odd Zumkeller is 945). Zumkeller infinitude/odd-density OPEN."

  "frobenius-above":
    module: Brockian.FrobeniusAbove
    verdict: admit
    quarantine: true
    ledger_run: "Harmonic/Aristotle ab22201e; AXLE @4.32"
    provenance_note: "HARMONIC-PROVED (Aristotle ab22201e, batch-of-8 classical target), independently AXLE-verified @4.32, axiom-clean. frobenius_above: for coprime a,b>1, every integer m > ab-a-b (the Frobenius number) is a nonnegative integer combination a*x + b*y. This is the 'above the Frobenius number everything is representable' half of the two-coin Chicken McNugget / Frobenius theorem. Uses only main Mathlib (the (a-1)(b-1) bound + coprime representability). The complementary non-representability of the Frobenius number itself (frobenius-mcnugget) is a separate queued job."

  "erdos-ginzburg-ziv":
    module: Brockian.ErdosGinzburgZiv
    verdict: admit
    quarantine: true
    ledger_run: "Harmonic/Aristotle 4c48bb51; AXLE @4.32"
    provenance_note: "HARMONIC-PROVED trophy theorem (Aristotle 4c48bb51), independently AXLE-verified @4.32, axiom-clean. erdos_ginzburg_ziv: among any 2n-1 elements of the cyclic group Z/n, some n of them sum to zero. A cornerstone of additive combinatorics (Erdos-Ginzburg-Ziv, 1961); the Davenport-constant / zero-sum family. Uses only main Mathlib. A genuinely hard theorem the decide-swarm could not touch."

  "twosquares":
