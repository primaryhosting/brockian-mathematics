    ledger_run: "frontier swarm; AXLE @4.32"
    provenance_note: "SWARM-PROVED general divisor-count (tau) structure theorems (AXLE @4.32, axiom-clean). tau(n) = n.divisors.card. FLAGSHIP tau_odd_iff_isSquare: tau(n) is ODD iff n is a perfect square (NEWLY PROVED -- no single named Mathlib lemma; via tau(n) = prod (v_p(n)+1) odd iff every exponent even iff n square, with a supporting isSquare_iff_even_factorization bridge lemma). Plus tau_eq_two_iff_prime (tau=2 iff prime), tau_eq_one_iff (tau=1 iff n=1), tau_pos_iff (tau>0 iff n>0), tau_prime_pow (tau(p^k)=k+1). Reusable structural facts about the divisor-count function."

  "multiperfect-structure":
