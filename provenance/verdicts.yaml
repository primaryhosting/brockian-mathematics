    provenance_note: "The golden spectrum is representation-theoretically FORCED (rep-theoretic mechanism, swarm-built, AXLE @4.32, axiom-clean): the C5 adjacency operator is FULL-D5-equivariant including reflections (adjacency_comm_d5; a reflection swaps rho and rho^-1, fixing A=rho+rho^-1), so every eigenspace is a D5-invariant subspace. The golden eigenspace is a 2-dimensional D5-subrepresentation -- the chi_golden isotypic block on which A acts as the scalar phi-1 (Schur) -- golden_eigenspace_is_subrep_d5. The pentagon's golden spectrum is not a coincidence but the shadow of a 2-dim irreducible symmetry."

  "erdos-straus":
