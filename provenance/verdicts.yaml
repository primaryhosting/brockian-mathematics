    provenance_note: "SWARM-PROVED multiperfect (k-perfect) structure (AXLE @4.32, axiom-clean). def Multiperfect k n := sigma(n)=k*n (genuinely novel -- Mathlib has no multiperfect notion). GENERAL theorems: multiperfect_one_iff (the ONLY 1-perfect number is 1); multiperfect_two_iff_perfect (2-perfect is exactly Nat.Perfect); multiperfect_ge_two_not_deficient (k-perfect with k>=2 is never deficient); not_multiperfect_prime_ge_two (no prime is k-perfect for k>=2). MultiperfectInfinitude is an unproven OPEN def -- whether infinitely many k-perfect numbers exist (k>=3) is OPEN."

  "totient-structure":
