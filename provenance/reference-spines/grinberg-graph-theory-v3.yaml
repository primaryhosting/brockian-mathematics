schema_version: 1
spine_id: grinberg-graph-theory-v3

source:
  title: An introduction to graph theory
  author: Darij Grinberg
  identifier: arXiv:2308.04512v3
  version_date: 2025-06-07
  canonical_url: https://arxiv.org/abs/2308.04512
  pdf_url: https://arxiv.org/pdf/2308.04512
  uploaded_filename: 2308.04512.pdf
  pdf_sha256: d4c8265e2307279bc470493da0b87ba5c6b48de31663989df1cf89b75764583c
  page_count: 454
  license: CC0-1.0
  license_locator: printed page 6

classification_tags:
  CLASSICAL_REFERENCE: >-
    An externally sourced classical theorem or definition. It may be formalized and
    verified here, but it is excluded from the Brockian novelty ledger.
  BROCKIAN_BRIDGE: >-
    A repository theorem that connects a classical reference result to the phase-depth,
    transfer, representation, or spectral spine. Integration work is not a novelty claim.
  BROCKIAN_RESULT: >-
    A theorem whose mathematical claim, not merely its formalization or packaging, is
    asserted as a Brockian contribution. This tag requires separate novelty review.
  EMPIRICAL_COMPUTATION: >-
    A finite experiment or data analysis. It must not enter the PROVED theorem count.

policy:
  novelty_ledger:
    excluded_tags:
      - CLASSICAL_REFERENCE
      - BROCKIAN_BRIDGE
      - EMPIRICAL_COMPUTATION
    review_required_tag: BROCKIAN_RESULT
  verified_registry: >-
    registry_verified means the declaration already appears as PROVED or DEFINITION in
    registry/theorems.json. lean_source_pending_axle means it is sorry-free Lean source
    but is not promoted by this manifest and awaits an independent AXLE attestation.
  source_boundary: >-
    The weighted Matrix-Tree Theorem is not a gauge/cohomology classification theorem.
    Grinberg's directed Laplacian uses outdegree minus adjacency and arborescences rooted
    to the selected vertex; any phase-depth use must state the convention explicitly.

scope:
  included:
    - cycle graphs and dihedral automorphisms
    - adjacency powers and walk counts
    - C5 adjacency traces and the existing C5 spectral continuation
    - spanning-tree and Matrix-Tree targets
    - explicit phase-depth bridge and empirical boundary
  excluded:
    - wholesale ingestion of the 454-page text
    - restating Mathlib theorems without a C5 or phase-depth integration purpose
    - treating classical graph theory as Brockian novelty
    - treating empirical discrimination results as formal theorems

