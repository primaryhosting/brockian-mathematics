name: full-corpus-audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1,4"

permissions:
  contents: read

concurrency:
  group: full-corpus-audit
  cancel-in-progress: true

jobs:
  full-corpus-audit:
    name: full-corpus-audit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          bash /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Audit the entire imported corpus
        run: lake build

      - name: Record audit provenance
        if: always()
        run: |
          lake env lean --version || true
          git rev-parse HEAD
