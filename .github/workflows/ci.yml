name: verified-core

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          bash elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib cache
        run: lake exe cache get || true

      - name: lake build
        run: lake build

      - name: Python deps
        run: python3 -m pip install --quiet pyyaml pytest

      - name: Script unit tests
        run: python3 -m pytest tests/test_gen_registry.py tests/test_audit_registry_consistency.py tests/test_no_theater_lint.py tests/test_ingest_discover.py tests/test_conveyor.py tests/test_conveyor_paperclip.py tests/test_conveyor_notify.py tests/test_export_obsidian.py tests/test_reference_spines.py -q

      - name: No-theater lint (blocking on holes in closed modules)
        run: |
          CLOSED=$(python3 -c "import yaml;print(' '.join(yaml.safe_load(open('provenance/verdicts.yaml')).get('closed_modules',[])))")
          python3 scripts/no_theater_lint.py Brockian/*.lean --closed $CLOSED

      - name: AXLE independent verification + registry generation
        env:
          AXLE_API_KEY: ${{ secrets.AXLE_API_KEY }}
        run: |
          # Re-attest every module against AXLE at the pinned environment, then derive the registry.
          # A PROVED register requires: axioms clean + AXLE verified (spec §2A triple verification;
          # local `lake build` above is the third leg).
          python3 scripts/gen_registry.py
          git diff --exit-code registry/theorems.json REGISTRY.md \
            || (echo "registry out of date — regenerate and commit" && exit 1)

      - name: Overclaim firewall + registry self-consistency (#35 / #36, blocking)
        run: |
          # No PROVED theorem may rest on an open node; every CONDITIONAL carries a rung;
          # every CONJECTURE is a container; every DISCHARGED points to a real PROVED theorem.
          python3 scripts/verify_firewall.py

      - name: Manifest firewall — labs may not cite unbacked claims (blocking)
        run: |
          # Every visual claim in every torus lab manifest must resolve to a registry theorem
          # with a green register; absent/UNVERIFIED fails the build. A picture cannot outrun its proof.
          python3 scripts/validate_manifests.py

      - name: Reference-spine provenance firewall (blocking)
        run: |
          # Classical sources and bridge work stay out of the novelty ledger; existing
          # declarations must resolve green, while new Lean source remains pending AXLE.
          python3 scripts/validate_reference_spines.py

      - name: Record build provenance
        run: |
          lake env lean --version
          echo "mathlib rev: $(python3 -c "import json;print(json.load(open('lake-manifest.json'))['packages'][0].get('rev',''))" 2>/dev/null || echo n/a)"
