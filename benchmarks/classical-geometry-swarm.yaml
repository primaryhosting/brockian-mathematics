tracks:
  - id: regular-pentagon-golden-ratio
    priority: P0
    classification: CLASSICAL_REFERENCE
    novelty_ledger: false
    state: benchmark_ready
    source_anchors:
      - source_id: yiu-advanced-euclidean-geometry-2013
        printed_pages: [106, 107]
        anchor: Section 1.3.1, regular pentagon construction and golden-ratio diagonal
    existing_baseline:
      source_files:
        - Brockian/Geometry.lean
      declarations:
        - Brockian.Geometry.pentagon_golden_diagonal
        - Brockian.Geometry.golden_ratio_in_C5_spectrum
    target: >-
      Reproduce the construction with exact Euclidean data, then map only the
      already-formalized diagonal/golden identities into the C5 spectral context.
    required_assumptions:
      - Nondegenerate regular pentagon with a declared side/diagonal convention.
      - Positive lengths before a ratio or square-root cancellation is used.
    adversarial_cases:
      - Reversed side-versus-diagonal convention.
      - Degenerate or self-intersecting five-point configuration.
      - Illicit inference that a classical golden identity is a Brockian novelty claim.
    proposed_declarations: []

  - id: signed-ceva-menelaus-projective-extension
    priority: P0
    classification: CLASSICAL_REFERENCE
    novelty_ledger: false
    state: specification_queued
    source_anchors:
      - source_id: venema-advanced-euclidean-geometry-2006
        printed_pages: [51, 56, 60, 65, 66]
        anchor: Chapters 8-9, sensed ratios, ideal points, Ceva, and Menelaus
      - source_id: yiu-advanced-euclidean-geometry-2013
        printed_pages: [201, 204]
        anchor: Sections 5.1 and 5.3, Menelaus and Ceva in directed-ratio form
    existing_baseline:
      source_files:
        - Brockian/MsCeva.lean
        - Brockian/MsMenelaus.lean
      declarations:
        - Brockian.MsCeva.ceva
        - Brockian.MsMenelaus.menelaus
    target: >-
      Specify a signed-ratio/projective extension of the current finite-plane
      theorems before attempting a proof. Keep the existing interior-segment
      results as baselines, not as evidence that all ideal-point cases are settled.
    required_assumptions:
      - A noncollinear reference triangle.
      - An explicit orientation or signed-ratio convention.
      - Explicit treatment of zero denominators and points at infinity.
    adversarial_cases:
      - Collinear reference vertices.
      - A cevian parallel to its opposite side.
      - A point equal to a triangle vertex or a zero denominator.
      - Product equals plus or minus one under the wrong orientation convention.
    proposed_declarations: []

  - id: barycentric-line-at-infinity
    priority: P1
    classification: CLASSICAL_REFERENCE
    novelty_ledger: false
    state: specification_queued
    source_anchors:
      - source_id: yiu-advanced-euclidean-geometry-2013
        printed_pages: [301, 314]
        anchor: Chapter 9, homogeneous barycentric coordinates and infinite points
      - source_id: coxeter-non-euclidean-geometry-fifth-1965
        printed_pages: [16, 45, 71, 90]
        anchor: Chapters 2-4, projective foundations, harmonic sets, and homogeneous coordinates
    target: >-
      Build a minimal projective-coordinate interface suitable for later Ceva,
      Menelaus, and polarity work. It is a classical foundation task, not a
      phase-depth model or a claimed new invariant.
    required_assumptions:
      - A field and a three-point noncollinear reference frame.
      - Equivalence under nonzero homogeneous rescaling.
      - A precise representation of the line at infinity.
    adversarial_cases:
      - Treating two homogeneous triples as unequal after nonzero rescaling.
      - Forgetting the zero-sum criterion for an infinite point.
      - Mixing affine coordinates with projective coordinates without a chart condition.
    proposed_declarations: []

  - id: klein-poincare-model-separation
    priority: P1
    classification: CLASSICAL_REFERENCE
    novelty_ledger: false
    state: specification_queued
    source_anchors:
      - source_id: venema-advanced-euclidean-geometry-2006
        printed_pages: [96, 100, 104]
        anchor: Chapter 14, Poincare disk, orthogonal circles, and hyperbolic distance
      - source_id: coxeter-non-euclidean-geometry-fifth-1965
        printed_pages: [157, 192, 252, 265]
        anchor: Chapters 8-9 and 14, Klein model, absolute polarity, and Poincare models
    target: >-
      Compare Klein and Poincare model conventions with a formal model card:
      state space, metric, geodesics, boundary, transformations, and invariant.
      Do not identify either model with phase-depth or gauge dynamics without a
      separately stated map and theorem.
    required_assumptions:
      - A specified open disk or convex-domain model.
      - A stated cross-ratio or conformal distance convention.
      - Explicit boundary exclusion and transformation domain.
    adversarial_cases:
      - Using a Euclidean chord as a Poincare geodesic away from a diameter.
      - Treating a boundary point as an interior point.
      - Claiming that a visualization or model analogy proves a phase-depth correspondence.
    proposed_declarations: []

  - id: atlas-transition-cocycle
    priority: P0
    classification: CLASSICAL_REFERENCE
    novelty_ledger: false
    state: benchmark_ready
    source_anchors:
      - source_id: cattaneo-notes-on-manifolds-2018
        printed_pages: [2, 3, 4, 5, 6, 7]
        anchor: Section 1, charts, atlases, transition maps, and smooth compatibility
      - source_id: hitchin-differentiable-manifolds-2014
        printed_pages: [6, 7, 8, 9, 10]
        anchor: Section 2, coordinate neighbourhoods, atlases, and smooth maps
      - source_id: morrow-kodaira-complex-manifolds-chapter-1
        printed_pages: [7, 8, 9, 10]
        anchor: Complex manifolds and pseudogroup transition structures
    target: >-
      Build one minimal Mathlib-backed chart example on a circle or sphere and
      expose its overlap maps, inverse law, and triple-overlap composition law.
      Reuse the existing manifold API rather than introducing a parallel atlas
      abstraction, and keep the result a classical infrastructure benchmark.
    required_assumptions:
      - A declared model space, topology, and manifold-with-corners structure.
      - Explicit membership in every chart source, target, and overlap domain.
      - Smoothness conditions at the exact order required by each transition claim.
    adversarial_cases:
      - A theorem that succeeds only because the chart overlap is empty.
      - Reversing the order of transition-map composition.
      - Treating coordinate equality as equality of manifold points without chart injectivity.
      - Rebranding atlas compatibility as a phase-depth cocycle theorem.
    proposed_declarations: []

  - id: real-line-bundle-cocycle-mobius
    priority: P0
    classification: BROCKIAN_BRIDGE
    novelty_ledger: false
    state: specification_queued
    source_anchors:
      - source_id: viaclovsky-introduction-to-manifolds-and-geometry-2022
        printed_pages: [5, 8, 10, 19, 20]
        anchor: Vector bundles, pullbacks, transition cocycles, and the two real line bundles on S1
      - source_id: cattaneo-notes-on-manifolds-2018
        printed_pages: [53, 56, 60, 61]
        anchor: Section 5, vector bundles, bundle charts, transition functions, and sections
    target: >-
      Use a real line bundle over S1 as the first explicit transition-cocycle
      fixture: encode the cover and overlap maps, verify the cocycle law, and
      separate the trivial and Mobius cases. Only after that fixture is green
      should a typed map to discrete phase-depth labels or holonomy be proposed.
    required_assumptions:
      - A stated open cover and transition maps on each nonempty overlap.
      - Continuity or smoothness, fibrewise linearity, and the identity/inverse/cocycle laws.
      - A cover or refinement adequate for the claimed Cech-cohomology computation.
    adversarial_cases:
      - Using a two-interval cover of S1 whose overlap is disconnected as though it were a good cover.
      - Declaring the sign-changing transition function nontrivial without ruling out a coboundary.
      - Treating a nowhere-zero local section as a global trivialization.
      - Importing a discrete edge label as a smooth transition function without a comparison map.
    proposed_declarations: []

  - id: exterior-derivative-square-zero
    priority: P0
    classification: CLASSICAL_REFERENCE
    novelty_ledger: false
    state: benchmark_ready
    source_anchors:
      - source_id: cattaneo-notes-on-manifolds-2018
        printed_pages: [91, 92, 93, 94, 95, 96]
        anchor: Section 9, de Rham differential, graded Leibniz law, naturality, and d squared equals zero
      - source_id: hitchin-differentiable-manifolds-2014
        printed_pages: [43, 44, 45, 50, 51]
        anchor: Exterior derivative and the closed/exact definition of de Rham cohomology
      - source_id: viaclovsky-introduction-to-manifolds-and-geometry-2022
        printed_pages: [31, 32, 33, 34, 35, 36, 37]
        anchor: Exterior derivative, pullback naturality, and Cartan calculus
    target: >-
      Make a small adapter benchmark around Mathlib's existing extDeriv API:
      specialize d(d omega)=0 for a twice-smooth differential form on a model
      vector space, then derive that exact forms are closed. Do not restate the
      library theorem or silently generalize it to arbitrary manifolds.
    required_assumptions:
      - The scalar field, model spaces, form degree, and differentiability order required by Mathlib.
      - A precise distinction between a model-space differential form and a global manifold form.
      - The degree shift and zero-form edge case stated explicitly.
    adversarial_cases:
      - Dropping the differentiability hypotheses needed for equality of mixed partials.
      - Confusing the model-space extDeriv theorem with a global de Rham complex.
      - Losing the degree shift when applying the exterior derivative twice.
      - Treating exact-implies-closed as the converse.
    proposed_declarations: []

  - id: finite-quotient-descent
    priority: P1
    classification: BROCKIAN_BRIDGE
    novelty_ledger: false
    state: specification_queued
    source_anchors:
      - source_id: viaclovsky-introduction-to-manifolds-and-geometry-2022
        printed_pages: [68, 69, 100, 101, 102, 103]
        anchor: Finite group quotients, quotient manifolds, degree, and covering examples
    target: >-
      State a model card for descent along a finite group action and implement
      the smallest free-action example for which an invariant map or form
      descends to the quotient. C5 or D5 may supply a symmetry group, but a
      quotient-manifold claim requires separate smoothness, freeness, and
      quotient hypotheses.
    required_assumptions:
      - A smooth action by a finite group on a specified manifold.
      - Freeness and the separation/properness hypotheses used to obtain a quotient manifold.
      - Invariance for descended objects, or equivariance when a nontrivial target action is present.
    adversarial_cases:
      - A D5 action with reflection or rotation fixed points.
      - Proving only a set quotient while claiming a smooth quotient manifold.
      - Confusing an equivariant map with an invariant map.
      - Assuming every object on the cover descends without compatibility on overlaps.
    proposed_declarations: []

  - id: discrete-to-de-rham-comparison-firewall
    priority: P0
    classification: BROCKIAN_BRIDGE
    novelty_ledger: false
    state: benchmark_ready
    source_anchors:
      - source_id: cattaneo-notes-on-manifolds-2018
        printed_pages: [95, 96, 97, 98, 99, 100, 101, 102, 103, 104, 105, 106]
        anchor: Global de Rham differential, closed and exact forms, and de Rham cohomology
      - source_id: hitchin-differentiable-manifolds-2014
        printed_pages: [50, 51, 52, 53, 54, 55, 56]
        anchor: De Rham cohomology, products, pullbacks, and homotopy invariance
      - source_id: viaclovsky-introduction-to-manifolds-and-geometry-2022
        printed_pages: [65, 71, 72, 73, 74, 75, 81, 82, 83, 84, 85, 86, 87]
        anchor: De Rham cohomology, Poincare lemma, homotopy, Mayer-Vietoris, spheres, and the torus
    existing_baseline:
      source_files:
        - Brockian/PhaseDepthClassification.lean
        - Brockian/PhaseDepthNonabelian.lean
      declarations:
        - Brockian.PhaseDepthClassification.cohomologous_iff_totalDepth_eq
        - Brockian.PhaseDepthNonabelian.gauge_iff_hol_eq
    target: >-
      Enforce a typed comparison contract between the finite C5 edge-cochain
      complex and the de Rham complex of a chosen geometric realization. No
      equality, equivalence, or transfer of invariants passes until an explicit
      degree-preserving cochain map is defined, proved to commute with the two
      differentials, and shown to have the claimed cohomological property.
    required_assumptions:
      - A specified geometric realization and a map between its discrete and smooth coefficient systems.
      - Explicit cochain groups, gradings, differentials, and the chain-map commutation theorem.
      - A separately stated injectivity, surjectivity, or quasi-isomorphism claim at each used degree.
    adversarial_cases:
      - Identifying two H1 notations merely because both classify a form of holonomy.
      - Inferring an equivalence from an accidental rank match in degree one.
      - Replacing the finite cycle by the smooth circle without a realization and comparison map.
      - Treating nonabelian conjugacy-class holonomy as ordinary de Rham cohomology.
    proposed_declarations: []

  - id: complex-torus-deformation-lab
    priority: P2
    classification: CLASSICAL_REFERENCE
    novelty_ledger: false
    state: specification_queued
    source_anchors:
      - source_id: morrow-kodaira-complex-manifolds-chapter-1
        printed_pages: [18, 19, 20, 21, 22, 23, 24, 25, 26]
        anchor: Analytic families, deformations, complex tori, Hopf surfaces, and ruled surfaces
      - source_id: platt-complex-manifolds-2025
        printed_pages: [8, 9, 10, 11, 12, 13]
        anchor: Complex-manifold definitions and compact examples
    target: >-
      Specify a small analytic-family fixture for complex tori only after the atlas,
      quotient, and bundle-transition interfaces are green. Keep deformation parameters,
      lattice discreteness, and quotient hypotheses explicit.
    required_assumptions:
      - A declared lattice in a finite-dimensional complex vector space.
      - Freeness and proper discontinuity of the translation action.
      - A typed family parameter and explicit compatibility of charts across the family.
    adversarial_cases:
      - A degenerate lattice that does not give a compact quotient.
      - Treating a set quotient as a complex manifold without chart descent.
      - Inferring deformation equivalence from equal dimensions alone.
    proposed_declarations: []
