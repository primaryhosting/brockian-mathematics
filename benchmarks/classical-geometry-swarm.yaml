schema_version: 1
benchmark_id: classical-geometry-swarm-v2

purpose: >-
  A provenance-backed, adversarial benchmark for AI-assisted discovery and
  formalization of classical geometry. It turns source-guided exploration into
  a sequence of separately auditable artifacts rather than a theorem claim.

source_policy:
  access: private_reference_only
  redistribution: metadata_only
  theorem_classification: classical_reference_only
  novelty_ledger: false
  boundary: >-
    Numerical sketches, dynamic-geometry observations, and language-model
    proposals are exploration evidence only. A mathematical result enters the
    repository registry only through a separately reviewed Lean declaration,
    clean local build, independent verification, and provenance record.

stages:
  - explore
  - formalize
  - prove
  - attack
  - audit

stage_contracts:
  explore:
    role: Explorer
    required_output: >-
      Exact-coordinate or symbolic examples, a reproducible construction, and
      at least one attempted falsifier. Floating-point diagrams alone do not pass.
  formalize:
    role: Specifier
    required_output: >-
      A Lean-ready proposition with every domain, orientation, nondegeneracy,
      and denominator condition stated explicitly.
  prove:
    role: Prover
    required_output: >-
      A sorry-free Lean proof candidate and its exact import/environment plan.
  attack:
    role: Adversary
    required_output: >-
      Counterexamples or proof obligations for omitted hypotheses, degenerate
      configurations, sign conventions, ideal points, and limiting cases.
  audit:
    role: Auditor
    required_output: >-
      A provenance record that distinguishes source, computation, formal proof,
      and any unresolved obligation; it must not promote a benchmark task to novelty.

