name = "brockian"
version = "0.1.0"
defaultTargets = ["Brockian"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.32.0"

[[lean_lib]]
name = "Brockian"
roots = ["Brockian"]
globs = ["Brockian.+"]
